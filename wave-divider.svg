<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
  <defs>
    <style>
      @keyframes wave1 {
        0%, 100% { d: path("M0,60 C150,120 350,0 600,60 C850,120 1050,0 1200,60 L1200,120 L0,120 Z"); }
        50%      { d: path("M0,60 C150,0 350,120 600,60 C850,0 1050,120 1200,60 L1200,120 L0,120 Z"); }
      }
      @keyframes wave2 {
        0%, 100% { d: path("M0,80 C200,40 400,100 600,80 C800,60 1000,100 1200,80 L1200,120 L0,120 Z"); }
        50%      { d: path("M0,80 C200,100 400,40 600,80 C800,100 1000,60 1200,80 L1200,120 L0,120 Z"); }
      }
      .wave1 { fill: #58a6ff; opacity: 0.3; animation: wave1 4s ease-in-out infinite; }
      .wave2 { fill: #39d353; opacity: 0.3; animation: wave2 5s ease-in-out infinite; }
    </style>
  </defs>
  <path class="wave2" d="M0,80 C200,40 400,100 600,80 C800,60 1000,100 1200,80 L1200,120 L0,120 Z"/>
  <path class="wave1" d="M0,60 C150,120 350,0 600,60 C850,120 1050,0 1200,60 L1200,120 L0,120 Z"/>
</svg>
